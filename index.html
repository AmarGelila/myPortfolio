<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Amar Gelila</title>
		<link
			rel="stylesheet"
			type="text/css"
			href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
		/>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<!-- Header -->
		<header>
			<div class="container nav-container">
				<div class="logo">AG</div>
				<ul class="nav-menu">
					<li><a href="#skills">Skills</a></li>
					<li><a href="#projects">Projects</a></li>
					<li><a href="#contact">Contact</a></li>
				</ul>
			</div>
		</header>

		<!-- Hero Section -->
		<section class="hero">
			<div class="container hero-content">
				<h1>Amar Gelila</h1>
				<p>Frontend Web Developer</p>
				<a href="#projects" class="btn btn-secondary">View My Work</a>
			</div>
		</section>

		<!-- Skills Section -->
		<section id="skills" class="skills">
			<div class="container">
				<h2 class="section-title">My Skills</h2>
				<div class="skills-container">
					<div class="skill-item">
						<div class="skill-icon skill-html">
							<i class="devicon-html5-plain colored"></i>
						</div>
						<h3>HTML</h3>
					</div>

					<div class="skill-item">
						<div class="skill-icon skill-css">
							<i class="devicon-css3-plain colored"></i>
						</div>
						<h3>CSS</h3>
					</div>

					<div class="skill-item">
						<div class="skill-icon skill-bootstrap">
							<i class="devicon-bootstrap-plain colored"></i>
						</div>
						<h3>Bootstrap</h3>
					</div>

					<div class="skill-item">
						<div class="skill-icon skill-tailwind">
							<i class="devicon-tailwindcss-original colored"></i>
						</div>
						<h3>Tailwind</h3>
					</div>

					<div class="skill-item">
						<div class="skill-icon skill-js">
							<i class="devicon-javascript-plain colored"></i>
						</div>
						<h3>JavaScript</h3>
					</div>

					<div class="skill-item">
						<div class="skill-icon skill-ts">
							<i class="devicon-typescript-plain colored"></i>
						</div>
						<h3>TypeScript</h3>
					</div>

					<div class="skill-item">
						<div class="skill-icon skill-react">
							<i class="devicon-react-original colored"></i>
						</div>
						<h3>React</h3>
					</div>

					<div class="skill-item">
						<div class="skill-icon skill-zustand">
							<svg
								viewBox="0 0 24 24"
								fill="#7c5b44"
								height="1em"
								width="1em"
								style="display: block; margin: auto"
							>
								<path
									d="M17.5 2C15.5 2 14 3.5 14 5.5c0 1.2.6 2.3 1.5 3-.3.8-.7 1.6-1.1 2.3-1.6-1.7-4.1-1.7-5.8 0-.4-.7-.8-1.5-1.1-2.3.9-.7 1.5-1.8 1.5-3C9 3.5 7.5 2 5.5 2S2 3.5 2 5.5C2 7.1 3 8.5 4.4 9.1c.3 2.5 1.5 4.8 3.3 6.6.6 1.8 1.9 3.4 3.6 4.4.2.1.5.1.7.1s.5 0 .7-.1c1.7-1 3-2.6 3.6-4.4 1.8-1.8 3-4.1 3.3-6.6 1.4-.6 2.4-2 2.4-3.6 0-2-1.5-3.5-3.5-3.5zm-12 5C4.1 7 3 5.9 3 4.5S4.1 2 5.5 2 8 3.1 8 4.5 6.9 7 5.5 7zm13 0c-1.4 0-2.5-1.1-2.5-2.5S17.1 2 18.5 2 21 3.1 21 4.5 19.9 7 18.5 7zM12 18c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"
								/>
							</svg>
						</div>
						<h3>Zustand</h3>
					</div>

					<div class="skill-item">
						<div class="skill-icon skill-node">
							<i class="devicon-nodejs-plain colored"></i>
						</div>
						<h3>Node.js</h3>
					</div>

					<div class="skill-item">
						<div class="skill-icon skill-express">
							<i class="devicon-express-original colored"></i>
						</div>
						<h3>Express</h3>
					</div>

					<div class="skill-item">
						<div class="skill-icon skill-postgres">
							<i class="devicon-postgresql-plain colored"></i>
						</div>
						<h3>PostgreSQL</h3>
					</div>

					<div class="skill-item">
						<div class="skill-icon skill-prisma">
							<i class="devicon-prisma-original colored"></i>
						</div>
						<h3>Prisma</h3>
					</div>
				</div>
			</div>
		</section>

		<!-- Projects Section -->
		<section id="projects" class="projects">
			<div class="container">
				<h2 class="section-title">My Projects</h2>

				<!-- Filter Buttons -->
				<div class="filter-container">
					<button class="filter-btn active" data-filter="all">
						All
					</button>
					<button class="filter-btn" data-filter="html">HTML</button>
					<button class="filter-btn" data-filter="css">CSS</button>
					<button class="filter-btn" data-filter="bootstrap">
						Bootstrap
					</button>
					<button class="filter-btn" data-filter="tailwind">
						Tailwind
					</button>
					<button class="filter-btn" data-filter="javascript">
						JavaScript
					</button>
					<button class="filter-btn" data-filter="typescript">
						TypeScript
					</button>
					<button class="filter-btn" data-filter="react">
						React
					</button>
					<button class="filter-btn" data-filter="zustand">
						Zustand
					</button>
					<button class="filter-btn" data-filter="nodejs">
						NodeJS
					</button>
					<button class="filter-btn" data-filter="express">
						Express
					</button>
					<button class="filter-btn" data-filter="postgres">
						PostgreSQL
					</button>
					<button class="filter-btn" data-filter="prisma">
						Prisma
					</button>
				</div>

				<div class="projects-grid" id="projects-grid">
					<!-- Projects will be dynamically inserted here -->
				</div>
			</div>
		</section>

		<!-- Footer -->
		<footer id="contact">
			<div class="container">
				<h2>Get In Touch</h2>
				<div class="social-links">
					<a href="https://github.com/AmarGelila" target="_blank">
						<i
							class="devicon-github-original"
							style="color: white"
						></i>
					</a>
					<a href="mailto:amaressamgelila.dev@gmail.com">
						<svg
							viewBox="0 0 24 24"
							fill="currentColor"
							height="1em"
							width="1em"
						>
							<path
								d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"
							/>
						</svg>
					</a>
				</div>
				<p>&copy; 2026 Amar Gelila.</p>
			</div>
		</footer>

		<script src="script.js"></script>
	</body>
</html>
